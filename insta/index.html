<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>줍줍 링크모음</title>
<meta name="robots" content="noindex">
<style>
:root{--bg:#fbf7f1;--card:#fff;--ink:#222;--sub:#8a8178;--btn:#e8492f;--btn-ink:#fff;--line:#eee5da}
@media (prefers-color-scheme:dark){:root{--bg:#1b1916;--card:#26231f;--ink:#f2ede6;--sub:#a99f94;--line:#3a352f}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:-apple-system,"Apple SD Gothic Neo","Malgun Gothic","Noto Sans KR",sans-serif}
main{max-width:480px;margin:0 auto;padding:28px 16px 40px}
header{text-align:center;margin-bottom:22px}
h1{font-size:28px;margin:0 0 6px;letter-spacing:-.5px}
header p{margin:0;color:var(--sub);font-size:14px}
.card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:14px;margin-bottom:16px;box-shadow:0 2px 10px rgba(0,0,0,.04)}
.top{display:flex;align-items:center;gap:8px;margin-bottom:10px}
.num{font-weight:800;color:var(--btn);font-size:15px}
.name{font-weight:700;font-size:17px}
.card img{width:100%;aspect-ratio:1/1;object-fit:cover;border-radius:12px;display:block;background:#fff}
.btn{display:block;text-align:center;margin-top:12px;padding:14px;border-radius:12px;background:var(--btn);color:var(--btn-ink);font-weight:700;font-size:16px;text-decoration:none}
.btn.off{opacity:.45;pointer-events:none}
footer{color:var(--sub);font-size:12px;line-height:1.6;text-align:center;margin-top:28px;padding-top:16px;border-top:1px solid var(--line)}
</style>
</head>
<body>
<main>
<header><h1>줍줍</h1><p>영상 속 제품을 번호로 찾아보세요</p></header>
<section class="card" id="1">
<div class="top"><span class="num">#1</span><span class="name">니임봇 B21</span></div>
<img src="../img/niimbot-b21.jpg" alt="니임봇 B21" loading="lazy">
<a class="btn" href="https://link.coupang.com/a/hOeBI6ihLo" target="_blank" rel="sponsored noopener">쿠팡에서 보기</a>
</section>
<section class="card" id="2">
<div class="top"><span class="num">#2</span><span class="name">해파리 가습기 (직사각형)</span></div>
<img src="../img/jellyfish-humidifier.jpg" alt="해파리 가습기 (직사각형)" loading="lazy">
<a class="btn" href="https://link.coupang.com/a/hWLq1wFrki" target="_blank" rel="sponsored noopener">쿠팡에서 보기</a>
</section>
<section class="card" id="3">
<div class="top"><span class="num">#3</span><span class="name">해파리 가습기 (원형)</span></div>
<img src="../img/jellyfish-humidifier.jpg" alt="해파리 가습기 (원형)" loading="lazy">
<a class="btn" href="https://link.coupang.com/a/hWLuMIZAIu" target="_blank" rel="sponsored noopener">쿠팡에서 보기</a>
</section>
<section class="card" id="4">
<div class="top"><span class="num">#4</span><span class="name">충전식 발열 양말</span></div>
<img src="../img/heated-socks.jpg" alt="충전식 발열 양말" loading="lazy">
<a class="btn" href="https://link.coupang.com/a/h6h8EXEQNg" target="_blank" rel="sponsored noopener">쿠팡에서 보기</a>
</section>
<footer>이 페이지는 쿠팡 파트너스 활동의 일환으로, 이에 따른 일정액의 수수료를 제공받습니다.</footer>
</main>
</body>
</html>
